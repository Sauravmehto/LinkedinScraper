# Render Blueprint — https://dashboard.render.com → New → Blueprint
# Docker runtime recommended (Playwright + Chromium pre-installed in base image).

services:
  - type: web
    name: gtm-report-generator
    runtime: docker
    dockerfilePath: ./docker/streamlit.Dockerfile
    dockerContext: .
    plan: standard
    region: oregon
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright
      - key: APOLLO_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
