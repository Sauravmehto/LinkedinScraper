# Render Blueprint — https://dashboard.render.com → New → Blueprint
# Or create Web Service manually with the build/start commands below.

services:
  - type: web
    name: gtm-report-generator
    runtime: python
    plan: standard
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: playwright install --with-deps chromium && streamlit run app/streamlit_app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APOLLO_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
